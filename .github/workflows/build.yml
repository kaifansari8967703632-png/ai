name: Build Flet APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: |
          pip install flet
          flet build apk
      - uses: actions/upload-artifact@v4
        with:
          name: flet-apk
          path: build/apk/*.apk
